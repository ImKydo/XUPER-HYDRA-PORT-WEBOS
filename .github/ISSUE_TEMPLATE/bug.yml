name: Error
description: Algo no funciona en la app
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de abrir: revisa Ajustes → Diagnóstico y copia el resultado.
        Sin modelo de TV y versión de webOS no se puede reproducir el fallo.

  - type: input
    id: tv
    attributes:
      label: Modelo de TV
      placeholder: "LG 55UR7300PSA"
    validations:
      required: true

  - type: input
    id: webos
    attributes:
      label: Versión de webOS
      description: Ajustes del TV → Acerca de → Información del TV
      placeholder: "webOS 6.5.3 / webOS 3.4.3"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión de la app
      placeholder: "3.1.86"
    validations:
      required: true

  - type: textarea
    id: diagnostico
    attributes:
      label: Diagnóstico de la app
      description: Ajustes → Diagnóstico (pega las líneas de Servicio, Red, Portal y FFmpeg)
      render: text
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abrir la app
        2. Ir a ...
        3. Pulsar ...
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas y qué pasó
    validations:
      required: true

  - type: checkboxes
    id: comprobaciones
    attributes:
      label: Comprobaciones
      options:
        - label: Desenchufé el TV 30 segundos y volví a probar
        - label: Reinstalé la app
        - label: Probé en Modo Normal y en Modo Fluido
