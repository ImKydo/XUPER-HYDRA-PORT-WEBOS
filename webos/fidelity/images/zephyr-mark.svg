<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 400 400" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="windTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2BE" />
      <stop offset="100%" stop-color="#009A8F" />
    </linearGradient>
    
    <linearGradient id="windBottom" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B2F9F" />
      <stop offset="100%" stop-color="#051B63" />
    </linearGradient>

    <filter id="breezeDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <path d="M 100 320 
           C 200 320, 270 280, 340 200 
           C 260 205, 180 215, 100 220 
           C 130 250, 130 290, 100 320 Z" 
        fill="url(#windBottom)" 
        filter="url(#breezeDepth)" />

  <path d="M 100 80 
           C 200 80, 270 120, 340 200 
           C 260 195, 180 185, 100 180 
           C 130 150, 130 110, 100 80 Z" 
        fill="url(#windTop)" 
        filter="url(#breezeDepth)" />
</svg>
